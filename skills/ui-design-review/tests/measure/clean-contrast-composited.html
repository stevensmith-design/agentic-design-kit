<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>fixture</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; }
  /* White on violet: 4.98:1 — the correct pairing for this ground. */
  .card { width: 420px; padding: 24px; background: #8F4BDD; color: #FFFFFF; }
  .card p { margin: 0; font-size: 14px; line-height: 1.6; }
  /* Ink on orange: 6.59:1. */
  .warm { width: 420px; padding: 24px; margin-top: 16px; background: #FA7014; color: #1A1008; }
  .warm p { margin: 0; font-size: 14px; }
</style></head><body>
  <div class="card"><p data-contrast>Body copy on violet, correctly set in white.</p></div>
  <div class="warm"><p data-contrast>Ink on orange, which is the passing pairing.</p></div>
</body></html>
