<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>fixture</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  /* The real-world shape: fixed height tuned so tightly to the content that the auto
     margin has no slack left to give, and eats the padding box instead. */
  .card {
    width: 300px;
    height: 230px;
    padding: 30px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #eee;
  }
  .card p { margin: 0; line-height: 1.5; }
  .meta { margin-block-start: auto; }
  .actions { display: flex; gap: 12px; }
  .actions button { width: 44px; height: 44px; }
</style></head><body>
  <div class="card" data-measure>
    <p>Title of the card</p>
    <p>Body copy long enough that this column is already close to the fixed height above, which is the precondition for the bug.</p>
    <p class="meta">Author · Team</p>
    <div class="actions"><button>x</button><button>y</button></div>
  </div>
</body></html>
