<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture</title>
<style>
html{font-family:Georgia,serif;color:#1f1f1c;background:#f7f6f2;line-height:1.55}
body{margin:0}
main{max-width:68ch;margin:0 auto;padding:48px 24px}
.rail{display:flex;gap:16px;overflow-x:auto;margin:0 -24px;padding:0 24px}

.rail::after{content:"";flex:0 0 1px}
.card{flex:0 0 220px;padding:16px;background:#ece6da}
</style>
</head>
<body>
<main>
<h1>Field season</h1>
<p>Field notes are kept in the shared drive and reviewed every Thursday by the whole crew.</p>
<div class="rail">
<div class="card">Plot 1</div>
<div class="card">Plot 2</div>
<div class="card">Plot 3</div>
<div class="card">Plot 4</div>
<div class="card">Plot 5</div>
<div class="card">Plot 6</div>
</div>
</main>

</body>
</html>
